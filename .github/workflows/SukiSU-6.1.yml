name: Build BoltX-SukiSUxSF-V1 (GKI 6.1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    env:
      DEBIAN_FRONTEND: noninteractive
      KERNEL_NAME: "BoltX-SukiSUxSF-V1"
      # Tetapkan path toolchain agar bisa digunakan di step berikutnya
      CLANG_PATH: "$(pwd)/toolchain/clang"

    steps:
      # Langkah 1: Instal semua dependensi yang diperlukan, termasuk yang menyebabkan error
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y git build-essential bc bison flex libssl-dev libelf-dev \
          curl python3 python3-pip lld zip unzip libncurses5-dev

      # Langkah 2: Unduh kode sumber dan submodul
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # Langkah 3: Siapkan toolchain Clang
      - name: Setup Toolchain (Clang 19)
        run: |
          mkdir -p toolchain/clang
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-2025/clang-r536225.tar.gz"
          echo "Downloading Clang..."
          curl -L "${CLANG_URL}" | tar -xz -C toolchain/clang
          
      # Langkah 4: Siapkan konfigurasi kernel (defconfig dan kustomisasi)
      - name: Prepare & Configure Kernel
        run: |
          export PATH="${CLANG_PATH}/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          
          echo "Generating GKI defconfig..."
          make O=out gki_defconfig

          # --- Custom Configs ---
          
          # 1. Set Kernel Name (Localversion)
          scripts/config --file out/.config --set-str LOCALVERSION "-${KERNEL_NAME}"
          
          # 2. Configure LTO (Link Time Optimization)
          echo "Configuring LTO..."
          scripts/config --file out/.config \
              -e LTO_CLANG \
              -d LTO_NONE \
              -e LTO_CLANG_THIN \
              -d LTO_CLANG_FULL \
              -e THINLTO

          # 3. Enable SukiSU KPM
          echo "Enabling SukiSU KPM..."
          scripts/config --file out/.config -e KPM

      # Langkah 5: Build kernel
      - name: Build Kernel Image
        run: |
          export PATH="${CLANG_PATH}/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          
          echo "Starting Build..."
          make -j"$(nproc --all)" O=out Image

      # Langkah 6: (Dianjurkan) Jalankan validasi KMI untuk stabilitas
      - name: Run KMI Validation
        run: |
          # Periksa apakah versi kernel adalah 6.1
          if grep -q "^VERSION = 6" Makefile && grep -q "^PATCHLEVEL = 1" Makefile; then
            echo "Running KMI validation for kernel 6.1..."
            # Pastikan python3 tersedia (sudah diinstall di langkah 1)
            python3 KMI_function_symbols_test.py
          else
            echo "Skipping KMI validation for kernel version != 6.1"
          fi

      # Langkah 7: Terapkan patch SukiSU
      - name: Apply SukiSU Patch
        run: |
          cd out/arch/arm64/boot
          
          echo "Downloading SukiSU Patcher..."
          curl -LSs "https://github.com/SukiSU-Ultra/SukiSU_patch/raw/refs/heads/main/kpm/patch_linux" -o patch
          chmod +x patch # Lebih aman dari chmod 777
          
          echo "Running Patch..."
          ./patch
          
          # Patcher seharusnya menghasilkan 'oImage'. Kita rename kembali.
          if [ -f oImage ]; then
            echo "Patch success! Renaming oImage to Image..."
            mv -f oImage Image
          else
            echo "Warning: oImage not found. The patch might have failed or modified 'Image' directly."
          fi
          
          ls -lh Image

      # Langkah 8: Verifikasi nama kernel di image akhir
      - name: Verify Kernel Name
        run: |
          strings out/arch/arm64/boot/Image | grep "Linux version" | head -n 1

      # Langkah 9: Upload hasil build sebagai artefak
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-Image
          path: out/arch/arm64/boot/Image
          compression-level: 9
